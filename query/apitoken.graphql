mutation CreateAPIToken ($input: CreateAPITokenInput!) {
	createAPIToken(input: $input) {
		apiToken {
			createdAt
			createdBy
			description
			expiresAt
			id
			isActive
			lastUsedAt
			name
			ownerID
			revokedAt
			revokedBy
			revokedReason
			scopes
			ssoAuthorizations
			tags
			token
			updatedAt
			updatedBy
			updatedByImpersonator
		}
	}
}
mutation DeleteAPIToken ($deleteAPITokenId: ID!) {
	deleteAPIToken(id: $deleteAPITokenId) {
		deletedID
	}
}
query GetAPITokenByID ($apiTokenId: ID!) {
	apiToken(id: $apiTokenId) {
		createdAt
		createdBy
		description
		expiresAt
		id
		isActive
		lastUsedAt
		name
		ownerID
		revokedAt
		revokedBy
		revokedReason
		scopes
		ssoAuthorizations
		tags
		token
		updatedAt
		updatedBy
		updatedByImpersonator
		owner {
			id
			displayName
		}
	}
}
query GetAPITokens ($where: APITokenWhereInput) {
	apiTokens(where: $where) {
		edges {
			node {
				createdAt
				createdBy
				description
				expiresAt
				id
				isActive
				lastUsedAt
				name
				ownerID
				revokedAt
				revokedBy
				revokedReason
				scopes
				tags
				token
				updatedAt
				updatedBy
			}
		}
	}
}
query GetAllAPITokens ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [APITokenOrder!]) {
	apiTokens(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				createdAt
				createdBy
				description
				expiresAt
				id
				isActive
				lastUsedAt
				name
				ownerID
				revokedAt
				revokedBy
				revokedReason
				scopes
				tags
				token
				updatedAt
				updatedBy
			}
		}
	}
}
mutation UpdateAPIToken ($updateAPITokenId: ID!, $input: UpdateAPITokenInput!) {
	updateAPIToken(id: $updateAPITokenId, input: $input) {
		apiToken {
			createdAt
			createdBy
			description
			expiresAt
			id
			isActive
			lastUsedAt
			name
			ownerID
			revokedAt
			revokedBy
			revokedReason
			scopes
			ssoAuthorizations
			tags
			token
			updatedAt
			updatedBy
			updatedByImpersonator
		}
	}
}
