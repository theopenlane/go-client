mutation CreateBulkCSVTask($input: Upload!) {
  createBulkCSVTask(input: $input) {
    tasks {
      assigneeID
      assignerID
      completed
      createdAt
      createdBy
      details
      detailsJSON
      displayID
      due
      externalUUID
      externalReferenceURL
      externalID
      environmentName
      environmentID
      id
      metadata
      managedBy
      isTemplate
      isSuggested
      integrationRunID
      idempotencyKey
      ownerID
      scopeName
      source
      scopeID
      priority
      parentTaskID
      status
      systemGenerated
      tags
      taskKindID
      taskKindName
      title
      updatedAt
      updatedBy
      assignee {
        id
        displayName
      }
      assigner {
        id
        displayName
      }
    }
  }
}

