mutation DeleteTask($deleteTaskId: ID!) {
  deleteTask(id: $deleteTaskId) {
    deletedID
  }
}

query GetAllTasks($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [TaskOrder!]) {
  tasks(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        assigneeID
        assignerID
        completed
        createdAt
        createdBy
        details
        detailsJSON
        displayID
        due
        environmentID
        externalUUID
        externalReferenceURL
        externalID
        environmentName
        id
        managedBy
        isTemplate
        metadata
        integrationRunID
        idempotencyKey
        isSuggested
        ownerID
        parentTaskID
        scopeID
        scopeName
        source
        priority
        status
        systemGenerated
        tags
        taskKindID
        taskKindName
        title
        updatedAt
        updatedBy
        assignee {
          id
          displayName
        }
        assigner {
          id
          displayName
        }
      }
    }
  }
}

