mutation CreateActionPlan($input: CreateActionPlanInput!) {
  createActionPlan(input: $input) {
    actionPlan {
      actionPlanKindID
      actionPlanKindName
      approvalRequired
      approverID
      blocked
      blockerReason
      completedAt
      controlSuggestions
      createdAt
      createdBy
      delegateID
      description
      details
      detailsJSON
      dismissedControlSuggestions
      dismissedImprovementSuggestions
      dismissedTagSuggestions
      dueDate
      externalContents
      externalFileID
      externalID
      fileID
      id
      improvementSuggestions
      integrationRunID
      internalNotes
      internalOwner
      internalOwnerGroupID
      internalOwnerIdentityHolderID
      internalOwnerUserID
      managedBy
      managementMode
      metadata
      name
      ownerID
      priority
      rawPayload
      requiresApproval
      reviewDue
      reviewFrequency
      revision
      source
      sourceDefinitionID
      sourceDefinitionVersion
      sourceInstanceID
      sourceKey
      status
      summary
      systemInternalID
      systemOwned
      tagSuggestions
      tags
      title
      updatedAt
      updatedBy
      updatedByImpersonator
      url
    }
  }
}

