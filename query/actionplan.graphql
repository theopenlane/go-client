query GetActionPlans($where: ActionPlanWhereInput) {
  actionPlans(where: $where) {
    edges {
      node {
        approvalRequired
        createdAt
        createdBy
        details
        dueDate
        id
        name
        priority
        reviewDue
        reviewFrequency
        revision
        source
        status
        tags
        updatedAt
        updatedBy
      }
    }
  }
}

query GetAllActionPlans($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [ActionPlanOrder!]) {
  actionPlans(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        approvalRequired
        createdAt
        createdBy
        details
        dueDate
        id
        name
        priority
        reviewDue
        reviewFrequency
        revision
        source
        status
        tags
        updatedAt
        updatedBy
      }
    }
  }
}

