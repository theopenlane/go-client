mutation CreateAssessmentResponse($input: CreateAssessmentResponseInput!) {
  createAssessmentResponse(input: $input) {
    assessmentResponse {
      assessmentID
      assignedAt
      campaignID
      completedAt
      createdAt
      createdBy
      displayName
      documentDataID
      dueDate
      email
      entityID
      emailOpenedAt
      emailOpenCount
      emailMetadata
      emailDeliveredAt
      emailClickedAt
      emailClickCount
      id
      isTest
      lastEmailEventAt
      identityHolderID
      isDraft
      ownerID
      sendAttempts
      startedAt
      status
      updatedAt
      updatedBy
    }
  }
}

mutation DeleteAssessmentResponse($deleteAssessmentResponseId: ID!) {
  deleteAssessmentResponse(id: $deleteAssessmentResponseId) {
    deletedID
  }
}

query GetAllAssessmentResponses($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [AssessmentResponseOrder!]) {
  assessmentResponses(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        assessmentID
        assignedAt
        completedAt
        createdAt
        createdBy
        documentDataID
        dueDate
        email
        id
        ownerID
        sendAttempts
        startedAt
        status
        updatedAt
        updatedBy
      }
    }
  }
}

query GetAssessmentResponseByID($assessmentResponseId: ID!) {
  assessmentResponse(id: $assessmentResponseId) {
    assessmentID
    assignedAt
    campaignID
    completedAt
    createdAt
    createdBy
    displayName
    documentDataID
    dueDate
    email
    emailOpenedAt
    emailMetadata
    entityID
    emailOpenCount
    emailDeliveredAt
    emailClickedAt
    emailClickCount
    id
    lastEmailEventAt
    identityHolderID
    isTest
    isDraft
    ownerID
    sendAttempts
    startedAt
    status
    updatedAt
    updatedBy
  }
}

query GetAssessmentResponses($first: Int, $last: Int, $after: Cursor, $before: Cursor, $where: AssessmentResponseWhereInput, $orderBy: [AssessmentResponseOrder!]) {
  assessmentResponses(
    first: $first
    last: $last
    after: $after
    before: $before
    where: $where
    orderBy: $orderBy
  ) {
    totalCount
