      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        assessmentID
        assignedAt
        completedAt
        createdAt
        createdBy
        documentDataID
        dueDate
        email
        id
        ownerID
        sendAttempts
        startedAt
        status
        updatedAt
        updatedBy
      }
    }
  }
}
