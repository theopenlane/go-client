query GetAllControls ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [ControlOrder!]) {
	controls(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				aliases
				assessmentMethods
				assessmentObjectives
				auditorReferenceID
				category
				categoryID
				controlOwnerID
				controlQuestions
				controlKindName
				createdAt
				createdBy
				delegateID
				description
				descriptionJSON
				displayID
				exampleEvidence
				externalUUID
				evidenceRequests
				id
				implementationGuidance
