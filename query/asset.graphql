mutation CreateAsset($input: CreateAssetInput!) {
  createAsset(input: $input) {
    asset {
      accessModelID
      id
      name
      observedAt
      internalOwner
      managedBy
      internalOwnerUserID
      internalOwnerIdentityHolderID
      internalOwnerGroupID
      internalOwnerGroup {
        id
        displayName
      }
      internalOwnerUser {
        id
        displayName
      }
      accessModelName
      assetDataClassificationID
      assetDataClassificationName
      assetSubtypeID
      assetSubtypeName
      assetType
      categories
      containsPii
      costCenter
      cpe
      createdAt
      createdBy
      criticalityID
      updatedAt
      updatedBy
      criticalityName
      description
      encryptionStatusID
      displayName
      encryptionStatusName
      environmentID
      environmentName
      estimatedMonthlyCost
      externalID
      identifier
      integrationRunID
      integrationID
      physicalLocation
      purchaseDate
      region
      scopeID
      scopeName
      securityTierID
      securityTierName
      sourceIdentifier
      sourcePlatformID
      sourceType
      tags
      website
    }
  }
}

