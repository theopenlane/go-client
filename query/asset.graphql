mutation DeleteAsset($deleteAssetId: ID!) {
  deleteAsset(id: $deleteAssetId) {
    deletedID
  }
}

query GetAllAssets($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [AssetOrder!]) {
  assets(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        accessModelID
        id
        name
        observedAt
        internalOwner
        managedBy
        internalOwnerUserID
        internalOwnerIdentityHolderID
        internalOwnerGroupID
        internalOwnerGroup {
          id
          displayName
        }
        internalOwnerUser {
          id
          displayName
        }
        accessModelName
        assetDataClassificationID
        assetDataClassificationName
        assetSubtypeID
        assetSubtypeName
        assetType
        categories
        containsPii
        costCenter
        cpe
        createdAt
        createdBy
        criticalityID
        updatedAt
        updatedBy
        criticalityName
        description
        encryptionStatusID
        displayName
        encryptionStatusName
        environmentID
        environmentName
        estimatedMonthlyCost
        externalID
        identifier
        integrationID
        integrationRunID
        physicalLocation
        purchaseDate
        region
        scopeID
        scopeName
        securityTierID
        securityTierName
        sourceIdentifier
        sourcePlatformID
        sourceType
        tags
        website
      }
    }
  }
}

