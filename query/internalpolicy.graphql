query GetAllInternalPolicies($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [InternalPolicyOrder!]){
  internalPolicies(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        approvalRequired
        approverID
        controlSuggestions
        createdAt
        createdBy
        delegateID
        details
        detailsJSON
        dismissedControlSuggestions
        dismissedImprovementSuggestions
        dismissedTagSuggestions
        displayID
        environmentID
        environmentName
        externalContents
        externalFileID
        externalID
        externalUUID
        fileID
        id
        improvementSuggestions
        integrationRunID
        internalPolicyKindID
        name
        ownerID
        internalPolicyKindName
        managedBy
        managementMode
        reviewDue
        reviewFrequency
        revision
        scopeID
        scopeName
        status
        summary
        tagSuggestions
        tags
        updatedAt
        updatedBy
        url
      }
    }
  }
}

