      accountType
      avatarUpdatedAt
      avatarRemoteURL
      avatarLocalFileID
      addedAt
      canonicalEmail
      createdAt
      createdBy
      department
      directoryName
      displayID
      displayName
      emailAliases
      environmentName
      environmentID
      externalID
      familyName
      givenName
      id
      identityHolderID
      integrationID
      integrationRunID
      jobTitle
      lastSeenIP
      metadata
      managedBy
      mfaState
      observedAt
      organizationUnit
      ownerID
      platformID
      phoneNumber
      primarySource
      profile
      rawProfileFileID
      scopeName
      scopeID
      removedAt
      secondaryKey
      sourceVersion
      status
      tags
      updatedAt
      updatedBy
