query GetAllTrustCenterNDARequests($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [TrustCenterNDARequestOrder!]) {
  trustCenterNdaRequests(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        accessLevel
        companyName
        createdAt
        createdBy
        email
        fileID
        firstName
        id
        lastName
        reason
        status
        tags
        trustCenterID
        updatedAt
        updatedBy
        approvedAt
        approvedByUserID
        autoApproved
        signedAt
        documentDataID
      }
    }
  }
}

