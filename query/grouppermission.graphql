query GetAllGroupPermissions ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [GroupPermissionOrder!]) {
	groupPermissions(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				displayID
				id
				name
				objectType
				permissions
			}
		}
	}
}
query GetGroupPermissionByID ($groupPermissionId: ID!) {
	groupPermission(id: $groupPermissionId) {
		displayID
		id
		name
		objectType
		permissions
	}
}
query GetGroupPermissions ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [GroupPermissionOrder!], $where: GroupPermissionWhereInput) {
	groupPermissions(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy, where: $where) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				displayID
				id
				name
				objectType
				permissions
			}
		}
	}
}
