query GetAllWorkflowProposals ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [WorkflowProposalOrder!]) {
	workflowProposals(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				approvedHash
				changes
				createdAt
				createdBy
				domainKey
				id
				owner
				ownerID
				preview
				proposedHash
				revision
				state
				submittedAt
				submittedByUserID
				tags
				updatedAt
				updatedBy
				workflowObjectRefID
			}
		}
	}
}
query GetWorkflowProposalByID ($workflowProposalId: ID!) {
	workflowProposal(id: $workflowProposalId) {
		approvedHash
		changes
		createdAt
		createdBy
		domainKey
		id
		owner
		ownerID
		preview
		proposedHash
		revision
		state
		submittedAt
		submittedByUserID
		tags
		updatedAt
		updatedBy
		workflowObjectRefID
	}
}
query GetWorkflowProposals ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [WorkflowProposalOrder!], $where: WorkflowProposalWhereInput) {
	workflowProposals(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy, where: $where) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				approvedHash
				changes
				createdAt
				createdBy
				domainKey
				id
				owner
				ownerID
				preview
				proposedHash
				revision
				state
				submittedAt
				submittedByUserID
				tags
				updatedAt
				updatedBy
				workflowObjectRefID
			}
		}
	}
}
