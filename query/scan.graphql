			assignedToUserID
			assignedToIdentityHolderID
			assignedToGroupID
			assignedTo
			createdAt
			createdBy
			generatedByPlatformID
			externalID
			environmentName
			environmentID
			discoveredVulnerabilityIds
			id
			managedBy
			integrationRunID
			metadata
			nextScanRunAt
			ownerID
			reviewedBy
			performedByGroupID
			scanSchedule
			scanDate
			reviewedByUserID
			reviewedByIdentityHolderID
			reviewedByGroupID
			performedBy
			performedByUserID
			scanType
			scopeName
			sourceDefinitionID
			sourceInstanceID
			sourceKey
			scopeID
