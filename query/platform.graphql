}

query GetAllPlatforms($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [PlatformOrder!]) {
  platforms(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        accessModelID
        accessModelName
        businessOwner
        businessOwnerGroupID
        businessOwnerIdentityHolderID
        businessOwnerUserID
        businessPurpose
        containsPii
        costCenter
        createdAt
        createdBy
        criticalityID
        criticalityName
        dataFlowSummary
        description
        displayID
        encryptionStatusID
        encryptionStatusName
        environmentID
        environmentName
        estimatedMonthlyCost
        externalID
        externalReferenceID
        externalUUID
        id
        integrationRunID
        internalOwner
        internalOwnerGroupID
        internalOwnerIdentityHolderID
        internalOwnerUserID
        managedBy
        metadata
        name
        ownerID
        physicalLocation
        platformDataClassificationID
        platformDataClassificationName
        platformKindID
        platformKindName
        platformOwnerID
        purchaseDate
        region
        scopeID
        scopeName
        scopeStatement
        securityOwner
        securityOwnerGroupID
        securityOwnerIdentityHolderID
        securityOwnerUserID
        securityTierID
        securityTierName
        sourceDefinitionID
        sourceIdentifier
        sourceInstanceID
        sourceKey
        sourceType
        status
        tags
        technicalOwner
        technicalOwnerGroupID
        technicalOwnerIdentityHolderID
        technicalOwnerUserID
        trustBoundaryDescription
        updatedAt
        updatedBy
        identityHolders {
          edges {
            node {
              id
              fullName
              email
              displayID
            }
          }
        }
      }
    }
  }
}

