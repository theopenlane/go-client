query GetAllSubcontrols($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [SubcontrolOrder!]) {
  subcontrols(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        aliases
        assessmentMethods
        assessmentObjectives
        auditorReferenceID
        category
        categoryID
        controlID
        controlOwnerID
        controlQuestions
        createdAt
        createdBy
        delegateID
        description
        displayID
        exampleEvidence
        externalUUID
        evidenceRequests
        id
        implementationGuidance
        mappedCategories
        ownerID
        refCode
        referenceFramework
        referenceID
        references
        source
        status
        subcategory
        subcontrolKindName
        tags
        title
        updatedAt
        updatedBy
      }
    }
  }
}

