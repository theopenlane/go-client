		tags
		updatedAt
		updatedBy
		updatedByImpersonator
		variables
		visibility
	}
}

query GetReports ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [ReportOrder!], $where: ReportWhereInput) {
	reports(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy, where: $where) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				createdAt
				createdBy
				displayID
				id
				name
				ownerID
				query
				reportKindID
				reportKindName
				reportOwnerID
				requestorID
				status
				tags
				updatedAt
				updatedBy
				updatedByImpersonator
				variables
				visibility
			}
		}
	}
}
mutation UpdateReport ($updateReportId: ID!, $input: UpdateReportInput!) {
	updateReport(id: $updateReportId, input: $input) {
		report {
			createdAt
			createdBy
			displayID
			id
			name
			ownerID
			query
			reportKindID
			reportKindName
			reportOwnerID
			requestorID
			status
			tags
			updatedAt
			updatedBy
			updatedByImpersonator
			variables
			visibility
		}
	}
}
