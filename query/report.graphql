mutation CreateReport ($input: CreateReportInput!) {
	createReport(input: $input) {
		report {
			createdAt
			createdBy
			displayID
			id
			name
			ownerID
			query
			reportKindID
			reportKindName
			reportOwnerID
			requestorID
			status
			tags
			updatedAt
			updatedBy
			updatedByImpersonator
			variables
			visibility
		}
	}
}
mutation DeleteReport ($deleteReportId: ID!) {
	deleteReport(id: $deleteReportId) {
		deletedID
	}
}
query GetAllReports ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [ReportOrder!]) {
	reports(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				createdAt
				createdBy
				displayID
				id
				name
				ownerID
				query
				reportKindID
				reportKindName
				reportOwnerID
				requestorID
				status
				tags
				updatedAt
				updatedBy
				updatedByImpersonator
				variables
				visibility
			}
		}
	}
}
query GetReportByID ($reportId: ID!) {
	report(id: $reportId) {
