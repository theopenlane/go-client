}

query GetAllRisks($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [RiskOrder!]) {
  risks(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        businessCosts
        businessCostsJSON
        createdAt
        createdBy
        delegateGroupID
        delegateID
        delegateIdentityHolderID
        delegateUserID
        delegateName
        details
        detailsJSON
        displayID
        externalUUID
        externalID
        environmentName
        environmentID
        dueDate
        id
        impact
        integrationRunID
        integrationID
        lastReviewedAt
        likelihood
        mitigatedAt
        managedBy
        mitigation
        mitigationJSON
        name
        nextReviewDueAt
        observedAt
        ownerID
        reviewRequired
        riskKindID
        riskDecision
        riskCategoryName
        riskCategoryID
        reviewFrequency
        residualScore
        riskKindName
        scopeName
        scopeID
        score
        stakeholderGroupID
        stakeholderID
        stakeholderUserID
        stakeholderIdentityHolderID
        stakeholderName
        status
        tags
        updatedAt
        updatedBy
      }
    }
  }
}

