mutation CreateBulkCSVDirectoryGroup ($input: Upload!) {
	createBulkCSVDirectoryGroup(input: $input) {
		directoryGroups {
			addedAt
			classification
			createdAt
			createdBy
			description
			directoryName
			displayID
			displayName
			email
			environmentID
			environmentName
			externalID
			externalSharingAllowed
			id
			integrationID
			managedBy
			integrationRunID
			memberCount
			metadata
			observedAt
			ownerID
			platformID
			profile
			rawProfileFileID
			removedAt
			scopeName
			sourceDefinitionID
			sourceInstanceID
			sourceKey
			scopeID
			sourceVersion
			status
			tags
			updatedAt
			updatedBy
		}
	}
}
