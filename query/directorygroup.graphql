mutation DeleteDirectoryGroup ($deleteDirectoryGroupId: ID!) {
	deleteDirectoryGroup(id: $deleteDirectoryGroupId) {
		deletedID
	}
}
query GetAllDirectoryGroups ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [DirectoryGroupOrder!]) {
	directoryGroups(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				classification
				createdAt
				createdBy
				description
				displayID
				displayName
				email
				externalID
				externalSharingAllowed
				id
				integrationID
				memberCount
				observedAt
				ownerID
				profile
				rawProfileFileID
				sourceVersion
				status
				tags
				updatedAt
				updatedBy
			}
		}
	}
}
