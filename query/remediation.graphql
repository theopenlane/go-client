mutation DeleteRemediation($deleteRemediationId: ID!) {
  deleteRemediation(id: $deleteRemediationId) {
    deletedID
  }
}

query GetAllRemediations($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [RemediationOrder!]) {
  remediations(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        completedAt
        createdAt
        createdBy
        dueAt
        error
        explanation
        externalID
        externalOwnerID
        externalURI
        id
        instructions
        intent
        metadata
        ownerReference
        prGeneratedAt
        pullRequestURI
        repositoryURI
        source
        state
        summary
        tags
        ticketReference
        title
        updatedAt
        updatedBy
      }
    }
  }
}

