}
query GetAllDirectoryMemberships ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [DirectoryMembershipOrder!]) {
	directoryMemberships(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				createdAt
				createdBy
				directoryAccountID
				directoryGroupID
				displayID
				id
				integrationID
				metadata
				observedAt
				ownerID
				role
				source
				updatedAt
				updatedBy
			}
		}
	}
}
